name = "bs-spieleparadies"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Ohne Treffer im dist-Verzeichnis wird index.html ausgeliefert, damit
# direkt aufgerufene Unterseiten nicht ins Leere laufen.
not_found_handling = "single-page-application"
# Nur /api/* geht durch den Worker. Alles andere liefert Cloudflare direkt
# als statische Datei aus, ohne den Worker überhaupt zu starten.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "bs-spieleparadies"
database_id = "eecc6723-f813-49d6-9bb3-dd43bc4b259c"
